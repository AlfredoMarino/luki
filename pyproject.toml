[project]
name = "LUKI"
version = "0.1.0"
description = "Lightweight Unsupervised Knowledge from Images — personal photo collection analysis with PyTorch, CLIP and DINOv3"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision",
    "transformers>=4.44",
    "pillow",
    "pyarrow",
    "pandas",
    "pyyaml",
    "numpy",
    "qdrant-client>=1.12",
    "tqdm",
    "gradio>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart",
    "httpx",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
]

[project.scripts]
luki-etl   = "luki.etl.cli:main"
luki-embed = "luki.embeddings.__main__:main"
luki-app   = "luki.app.__main__:main"
luki-api   = "luki.api.__main__:main"
luki-eval  = "luki.eval.cli:main"

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "nbclient", "nbformat", "matplotlib"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that load the real DINOv3 model (~1.2GB, ~15s cold).",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]